# 交叉驗證自動掃描設定檔 (Cross-Verification Sweep Configuration)
# 定義要在 Python 理論模型與 BookSim 之間進行比對的所有拓撲與維度陣列

sweep:
  - topology: mesh
    dimensions: [2, 3, 4, 5, 6]  # 對應 width = height = k
    routing: xy
    vcs: 1

  - topology: torus
    dimensions: [2, 3, 4, 5, 6]
    routing: dim_order
    vcs: 2  # Torus 需要至少 2 個 VC 避免死結

  - topology: ring
    dimensions: [4, 5, 6, 7, 8, 12, 16, 24] # 對應總節點數
    routing: dim_order
    vcs: 2  # Ring 需要至少 2 個 VC 避免死結

# 共用參數
common:
  packet_size: 1  # 固定為 1 flit 排除序列化變數，專注比對網路路徑與負載
  buffer_size: 8
