# 通用 NoC 架構設定參數 (Universal NoC Architecture Parameters)
architecture:
  topology: mesh        # 拓撲結構 (mesh, torus)
  width: 4              # 網路寬度 (X軸)
  height: 4             # 網路高度 (Y軸)
  routing: xy           # 路由演算法 (xy)
  packet_size: 4        # 封包大小 (以 Flit 為單位)
  buffer_size: 8        # 每個虛擬通道(VC)/輸入埠的緩衝區深度 (flits)
  num_vcs: 1            # 虛擬通道(Virtual Channels)數量

# 通用流量與模擬設定 (Universal Traffic and Simulation Settings)
simulation:
  traffic_pattern: uniform # 流量模式 (uniform, transpose, bitcomp 等)
  warmup_cycles: 1000      # 熱身週期數
  sim_cycles: 5000         # 實際收集統計資料的模擬週期數
  # 注意：injection_rate 通常由 sweep script 覆蓋，但這裡提供一個預設值
  injection_rate: 0.1

# 特定模擬器的覆蓋/擴充參數 (Simulator-Specific Overrides)
simulators:
  booksim:
    # BookSim 專屬的額外參數
    vc_allocator: islip
    sw_allocator: islip
    alloc_iters: 1
    credit_delay: 1
    routing_delay: 1

  noxim:
    # Noxim 專屬的額外參數 (預留)
    selection_strategy: 0 # 0=Random, 1=BufferLevel etc.

  pronoc:
    # ProNoC 專屬的額外參數 (預留)

  constellation:
    # Constellation 專屬的額外參數 (預留)
