name: noc_c_model CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Check for relevant file changes
      uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          relevant:
            - 'noc_c_model/**'
            - 'dse_tools/runners/run_c_model_dse.py'
            - 'dse_tools/runners/verify_link_load.py'
            - '.github/workflows/noc_c_model_ci.yml'

    - name: Install System Dependencies
      if: steps.filter.outputs.relevant == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y libyaml-cpp-dev libgtest-dev cmake build-essential

    - name: Compile GTest (Fallback)
      if: steps.filter.outputs.relevant == 'true'
      run: |
        # Ubuntu often provides only source in libgtest-dev, so we compile and install the static libs just in case
        cd /usr/src/gtest || exit 0
        sudo cmake .
        sudo make
        sudo cp lib/*.a /usr/lib || true

    - name: Set up Python
      if: steps.filter.outputs.relevant == 'true'
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python Dependencies
      if: steps.filter.outputs.relevant == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install networkx numpy pyyaml pandas

    - name: Build and Run C Model Tests
      if: steps.filter.outputs.relevant == 'true'
      run: |
        make -C noc_c_model test
        python3 dse_tools/runners/verify_link_load.py
