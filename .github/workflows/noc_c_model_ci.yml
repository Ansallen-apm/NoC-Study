name: noc_c_model CI

on:
  push:
    paths:
      - 'noc_c_model/**'
      - 'dse_tools/runners/run_c_model_dse.py'
      - 'dse_tools/runners/verify_link_load.py'
  pull_request:
    paths:
      - 'noc_c_model/**'
      - 'dse_tools/runners/run_c_model_dse.py'
      - 'dse_tools/runners/verify_link_load.py'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libyaml-cpp-dev libgtest-dev

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install networkx numpy pyyaml pandas

    - name: Build and Run C Model Tests
      run: |
        make -C noc_c_model test
