name: Auto Merge PRs # 自動合併 Pull Requests

# 觸發條件設定 (Triggers)
on:
  pull_request:
    types:
      - opened           # 當 PR 被建立時
      - synchronize      # 當 PR 有新 commit 更新時
      - reopened         # 當 PR 被重新開啟時
      - ready_for_review # 當 PR 從草稿 (draft) 狀態轉為準備審查 (ready for review) 時

# 權限設定 (Permissions)
permissions:
  contents: write       # 允許修改程式碼內容 (為了合併 PR 需要寫入權限)
  pull-requests: write  # 允許操作與修改 Pull Requests 狀態

jobs:
  auto-merge:
    runs-on: ubuntu-latest # 在最新的 Ubuntu 環境中執行
    steps:
      - name: Checkout repository # 檢索專案的程式碼
        uses: actions/checkout@v3

      - name: Enable Auto-merge for Pull Request # 啟用自動合併功能
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 使用內建的 GitHub Token 來進行授權
        run: |
          # 使用 --auto 參數：這會將 PR 放入自動合併佇列。
          # 系統會等待所有必備的 Checks (例如 CI 測試) 通過，以及符合分支保護規則後，才會安全地執行合併 (Merge)。
          # 注意：此功能需要在 Repository Settings 中開啟 "Allow auto-merge"。
          gh pr merge ${{ github.event.pull_request.number }} --auto --merge
